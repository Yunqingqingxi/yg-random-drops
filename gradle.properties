# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# 26.2 是自定义 MC 版本，其 minecraft jar 分发时已是「官方命名」形态、无 yarn/intermediary 映射。
# 必须开启 loom 的 disableObfuscation 跳过 MAPPINGS 配置（否则 1.17.2x 会在配置期报
# “Configuration 'mappings' has no dependencies”）。注意：该开关同时会跳过 remap 系配置
# （modImplementation/modApi）的注册，因此所有依赖一律用普通 implementation，不要用 modImplementation。
fabric.loom.disableObfuscation=true

# Mod Properties（本包独立版本号，与其他包互不相干）
mod_version=1.0.0
group=com.yunxigames

# Dependencies
fabric_api_version=0.159.0+26.2
